[project]
name = "fde-ai-platform-backend"
version = "2.0.0"
description = "AI-orchestrated FDE application delivery platform built with FastAPI and LangChain"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.20.1",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-openai>=0.3,<2",
  "langchain-text-splitters>=0.3,<2",
  "markdown-it-py>=3,<5",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "pgvector>=0.3,<1",
  "psycopg2-binary>=2.9.13",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<5",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 110

